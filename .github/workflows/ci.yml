# Compila en cada push: si algo se rompe, GitHub lo marca con una ✗.
# Las versiones NO se publican aquí: la llave de firma solo está en la PC
# (ver scripts/publicar.ps1).
name: Compilar

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compilar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug lintDebug --console=plain
